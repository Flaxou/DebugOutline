name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle 8.12
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.12/bin/gradle --version

      - name: Build
        run: /opt/gradle-8.12/bin/gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: debugoutline-jar
          path: build/libs/*.jar

      - name: Dump Minecraft API signatures
        if: always()
        run: |
          CP=$(find /home/runner/.gradle -name "*.jar" | tr '\n' ':')
          mkdir -p api-dump
          for c in \
            net.minecraft.client.render.RenderLayer \
            'net.minecraft.client.render.RenderLayer$MultiPhaseParameters' \
            net.minecraft.client.gl.RenderPipelines \
            com.mojang.blaze3d.pipeline.RenderPipeline \
            'com.mojang.blaze3d.pipeline.RenderPipeline$Builder' \
            com.mojang.blaze3d.platform.DepthTestFunction \
            com.mojang.blaze3d.pipeline.BlendFunction; do
            echo "=== $c ===" >> api-dump/api.txt
            javap -p -cp "$CP" "$c" >> api-dump/api.txt 2>&1 || echo "introuvable" >> api-dump/api.txt
          done

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: api-dump/api.txt
